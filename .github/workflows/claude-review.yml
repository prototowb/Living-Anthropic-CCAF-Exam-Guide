# Claude Code review — EXECUTABLE root-level twin of the Scenario 5 v0.7
# teaching artifact at derivates/claude-code-companion/.github/workflows/.
#
# GitHub only triggers workflows from the repo root's .github/workflows/,
# so the companion's copy never runs — this file is the live one. Keep the
# two in sync: structural changes land in the companion first (it carries
# the full mandate annotations), then propagate here. Deltas in this copy,
# by design:
#   - `defaults.run.working-directory` points every step at the companion
#     subproject, where the scripts, prompts, and hooks live.
#   - setup-node's `cache-dependency-path` targets the companion lockfile.
#   - The diff under review is the WHOLE repo's PR diff (paths are
#     repo-root-relative); the review prompt operates on diff text, so the
#     wider scope needs no other change.
#
# Modes: with the ANTHROPIC_API_KEY secret configured this posts real
# two-pass Claude reviews; without it, a labelled DRY-RUN (synthetic
# reviewer) exercises the identical pipeline at zero cost. Repo variable
# CLAUDE_REVIEW_MONTHLY_BUDGET_USD caps real spend (see budget step).
#
# Split two-pass Claude review of every PR with fork-safe data handling, a
# real monthly budget accumulator, incremental-review continuity, and a
# calibrated confidence gate.
#
# Pipeline: budget check → fetch diff via API → pass 1 (find: one per-file
# process per touched file + one integration process) → pass 2 (independent
# filter) → calibrated confidence gate → dedupe vs prior run → post →
# record spend.
#
# Architect mandates honoured here:
#   - TS 3.6 non-interactive `-p` invocation with `--output-format json`.
#   - TS 3.6 generator-isolation: a fresh `claude` process per PASS (two
#     passes = two processes), no `--resume`, no shared session id.
#     See deepening task C.
#   - TS 3.6 fork-PR safety (v0.6): `pull_request_target` with hardened
#     handling — the workflow checks out ONLY the base repo (trusted
#     prompts/scripts/hooks) and fetches the PR's diff as DATA via the API.
#     Fork code is never checked out, installed, or executed in the
#     privileged context. `persist-credentials: false` on checkout; ledger
#     writes go through the Contents API, never `git push`.
#   - TS 4.6 independent-reviewer pass (v0.6, deepening task A): a second
#     fresh `claude -p` runs docs/CI_REVIEW_OF_REVIEW_PROMPT.md over the diff
#     plus pass 1's draft and strips false positives. Dry-run mirror:
#     scripts/review-filter.ts (acceptance-tested by `npm run review:eval`).
#   - TS 4.6 per-file vs cross-file split (v0.7, deepening task B): pass 1
#     runs one scoped process per touched file (local defects) plus one
#     integration process (imports/exports/data-flow), merged into a single
#     draft. Splitter: scripts/ci/split-diff.ts; dry mirror:
#     `review:dry --split`; acceptance fixture: sample-6-cross-file.
#   - TS 5.5 calibrated confidence gate (v0.7, deepening task F): the final
#     emission silences comments below CONFIDENCE_THRESHOLD (0.60), derived
#     by `npm run review:calibrate` from the labelled corpus and
#     drift-guarded by `review:calibrate --check`.
#   - TS 3.6 incremental continuity (v0.6, deepening task D): the prior
#     ReviewSummary is recovered from the last bot comment's embedded
#     `<!-- claude-review:summary v1 -->` block, deduped by
#     (path, line, rationale-hash) via scripts/ci/dedupe-findings.ts, and the
#     comment reports only new / still-unaddressed findings, marking fixed
#     ones "resolved". A no-op push posts nothing.
#   - TS 3.6 cost control (v0.6): scripts/ci/budget.ts keeps a month-stamped
#     spend ledger at `ci/spend.json` on the `_runs` branch. The `=0`
#     off-switch from v0.4 still works; a positive budget now short-circuits
#     once the month's accumulated spend reaches it. Real runs record
#     `total_cost_usd` from the Claude CLI's JSON output.
#   - v0.3 hook overlay (docs/CI_HOOK_OVERLAY.md) is materialised at
#     .claude/settings.local.json before claude is invoked so the scope-guard
#     hook bounds Edit/Write to touched files.
#
# CLI policy (v0.6, replaces the v0.4 silent fallback): the mode is keyed on
# the ANTHROPIC_API_KEY secret, not on what happens to be installed.
#   - Secret present → install the Claude CLI and HARD-REQUIRE it; a missing
#     binary after install is a failure, never a silent downgrade.
#   - Secret absent → explicit dry-run mode over the real PR diff
#     (scripts/review-pr.ts + scripts/review-filter.ts), labelled as such in
#     the posted comment. Zero spend is recorded.

name: claude-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# One review per PR head. A fresh push cancels the in-flight run so contributors
# don't get duplicate comments while iterating.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

# Least-privilege, with one deliberate widening: `contents: write` exists ONLY
# so the budget ledger can be written to the `_runs` branch via the Contents
# API. Code branches are protected by branch protection; this workflow never
# runs `git push` (the hook overlay denies it to Claude, and the steps below
# use `gh api` exclusively).
permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest

    # All scripts, prompts, and hooks live in the companion subproject.
    defaults:
      run:
        working-directory: derivates/claude-code-companion

    # Trigger gate:
    #   1. `pull_request_target` events — fork PRs included. Safe because the
    #      privileged context only ever executes BASE-repo code; the PR
    #      contributes data (a diff), never code. See file header.
    #   2. `issue_comment` events on a PR whose body starts with
    #      `/claude-review`, posted by a user with write access.
    if: |
      (github.event_name == 'pull_request_target') ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/claude-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )

    steps:
      - name: Resolve PR ref
        id: pr
        # Runs BEFORE checkout — the companion working-directory does not
        # exist yet, so this step overrides back to the workspace root.
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            pr_number="${{ github.event.pull_request.number }}"
          else
            pr_number="${{ github.event.issue.number }}"
          fi
          pr_json="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}")"
          {
            echo "number=${pr_number}"
            echo "head_sha=$(echo "$pr_json" | jq -r .head.sha)"
            echo "head_repo=$(echo "$pr_json" | jq -r .head.repo.full_name)"
            echo "is_fork=$(echo "$pr_json" | jq -r '.head.repo.full_name != "${{ github.repository }}"')"
          } >> "$GITHUB_OUTPUT"

      # Fork-PR safety: check out the BASE repo only. Prompts, scripts, hooks,
      # and package-lock all come from trusted code. The PR head is never
      # checked out in this privileged context.
      - name: Checkout base repo (trusted code only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: derivates/claude-code-companion/package-lock.json

      - name: Install dependencies (base repo lockfile)
        run: npm ci

      # Budget accumulator (v0.6, replaces the v0.4 honest-stub).
      # Ledger lives at ci/spend.json on the `_runs` branch; fetched via the
      # Contents API (404 → first month, zero spend). scripts/ci/budget.ts
      # owns the compare/record semantics — see its header for the contract
      # (`0` = hard off, unset = no ceiling, spent >= budget = skip).
      - name: Budget check
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUDGET: ${{ vars.CLAUDE_REVIEW_MONTHLY_BUDGET_USD }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/contents/ci/spend.json?ref=_runs" \
            --jq .content 2>/dev/null | base64 -d > /tmp/spend.json || echo '{}' > /tmp/spend.json
          npm run -s ci:budget -- check --ledger /tmp/spend.json --budget "${BUDGET:-}" > /tmp/budget.out
          cat /tmp/budget.out >> "$GITHUB_OUTPUT"
          if grep -q '^skip=true$' /tmp/budget.out; then
            spent="$(grep '^spent_usd=' /tmp/budget.out | cut -d= -f2)"
            gh pr comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "Skipped: monthly Claude review budget reached (\$${spent} spent this month against \`CLAUDE_REVIEW_MONTHLY_BUDGET_USD\`). Raise the repo variable to re-enable reviews."
          fi

      # Fetch-and-diff only (fork-PR safety): the PR contributes DATA. The
      # diff and the touched-file list come from the API; nothing from the PR
      # head is executed.
      - name: Fetch PR diff and touched files (API, no checkout)
        if: steps.budget.outputs.skip != 'true'
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" > /tmp/pr.diff
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > /tmp/touched
          echo "Touched files:"; cat /tmp/touched
          # Colon-separated for .claude/hooks/scope-guard.sh.
          touched_colon="$(tr '\n' ':' < /tmp/touched | sed 's/:$//')"
          echo "touched_colon=${touched_colon}" >> "$GITHUB_OUTPUT"

      # Incremental continuity (deepening task D): recover the prior
      # ReviewSummary from the last bot comment carrying the machine-readable
      # marker. Absent marker → first run.
      - name: Fetch prior review summary
        if: steps.budget.outputs.skip != 'true'
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | contains("<!-- claude-review:summary v1 -->"))] | last | .body // empty' \
            > /tmp/prior-comment.md || true
          if [ -s /tmp/prior-comment.md ]; then
            # The summary is the fenced JSON block after the marker.
            awk '/^```json$/{grab=1;next} /^```$/{grab=0} grab' /tmp/prior-comment.md > /tmp/prior.json
            if jq -e .comments /tmp/prior.json >/dev/null 2>&1; then
              echo "has_prior=true" >> "$GITHUB_OUTPUT"
              echo "Prior summary recovered ($(jq '.comments | length' /tmp/prior.json) finding(s))."
            else
              echo "has_prior=false" >> "$GITHUB_OUTPUT"
              echo "Marker found but JSON unparseable — treating as first run."
            fi
          else
            echo "has_prior=false" >> "$GITHUB_OUTPUT"
            echo "No prior review comment — first run."
          fi

      # Materialise the CI hook overlay before invoking claude. Spec lives in
      # docs/CI_HOOK_OVERLAY.md (Scenario 5 v0.3). The overlay narrows
      # WebFetch, hardens the Bash deny-list, and wires scope-guard.sh as a
      # preToolUse hook for Edit/Write.
      - name: Write .claude/settings.local.json (CI hook overlay)
        if: steps.budget.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p .claude
          cat > .claude/settings.local.json <<'JSON'
          {
            "$schema": "https://json.schemastore.org/claude-code-settings.json",
            "permissions": {
              "allow": [
                "WebFetch(https://raw.githubusercontent.com/**)",
                "WebFetch(https://docs.github.com/**)",
                "WebFetch(https://api.github.com/**)"
              ],
              "deny": [
                "Bash(rm *)",
                "Bash(rm -rf *)",
                "Bash(rmdir *)",
                "Bash(git push *)",
                "Bash(git push:*)",
                "Bash(git reset --hard *)",
                "Bash(git checkout -- *)",
                "Bash(git clean -fd *)",
                "Bash(curl * | bash)",
                "Bash(curl * | sh)",
                "Bash(wget * | bash)",
                "Bash(wget * | sh)",
                "Bash(npm publish *)",
                "Bash(npm run extract:api *)",
                "Bash(sudo *)",
                "Bash(shutdown *)",
                "Bash(dd if=*)",
                "Bash(mkfs *)",
                "Bash(:(){ :|:& };:)",
                "WebFetch(*)"
              ]
            },
            "hooks": {
              "preToolUse": [
                { "matcher": { "tool": "Edit" }, "command": ".claude/hooks/scope-guard.sh" },
                { "matcher": { "tool": "Write" }, "command": ".claude/hooks/scope-guard.sh" }
              ]
            }
          }
          JSON
          chmod +x .claude/hooks/scope-guard.sh || true

      # CLI policy: mode is keyed on the secret, not on runner contents.
      - name: Install Claude CLI (real mode only)
        if: steps.budget.outputs.skip != 'true'
        id: mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            npm install -g @anthropic-ai/claude-code
            command -v claude >/dev/null 2>&1 || {
              echo "::error::ANTHROPIC_API_KEY is set but the Claude CLI failed to install — refusing to fall back silently."
              exit 1
            }
            echo "mode=real" >> "$GITHUB_OUTPUT"
          else
            echo "No ANTHROPIC_API_KEY secret — explicit dry-run mode (synthetic reviewer over the real PR diff)."
            echo "mode=dry" >> "$GITHUB_OUTPUT"
          fi

      # Pass 1 — find, as a SPLIT review (v0.7, deepening task B): one fresh
      # claude process per touched file (per-file scope: local defects only),
      # then ONE integration pass over the per-file findings + the full diff
      # (scope: imports/exports/data-flow). Every process is fresh, no
      # --resume (generator isolation, deepening task C). The prior findings
      # travel INTO the integration prompt so the model also biases toward
      # "new or still-unaddressed only"; the dedupe step below enforces it
      # mechanically regardless.
      - name: Review pass 1 (find — per-file + integration)
        if: steps.budget.outputs.skip != 'true'
        id: pass1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_TOUCHED_FILES: ${{ steps.scope.outputs.touched_colon }}
          CLAUDE_PR_NUMBER: ${{ steps.pr.outputs.number }}
          HAS_PRIOR: ${{ steps.prior.outputs.has_prior }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/claude
          extract_json() {
            npx tsx -e 'import{extractFirstJsonObject}from"./src/agents/schemas/parse";let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{const o=extractFirstJsonObject(t);if(!o){console.error("model emitted no JSON object");process.exit(1)}console.log(JSON.stringify(o,null,2))})'
          }
          if [ "${{ steps.mode.outputs.mode }}" = "real" ]; then
            npx tsx scripts/ci/split-diff.ts /tmp/pr.diff /tmp/perfile > /tmp/perfile-list
            echo 0 > /tmp/claude/pass1-cost
            : > /tmp/claude/perfile-summaries.json
            while IFS=$'\t' read -r fpath fpatch; do
              {
                echo "SCOPE: PER-FILE PASS for \`$fpath\` — see '## Pass scopes' in the prompt below. Flag only defects provable inside this file."
                echo
                cat docs/CI_REVIEW_PROMPT.md
                echo; echo "## Unified diff under review (single file: $fpath)"; echo '```diff'
                cat "$fpatch"
                echo '```'
              } > /tmp/claude/pf-prompt.md
              claude -p "$(cat /tmp/claude/pf-prompt.md)" --output-format json > /tmp/claude/pf-raw.json
              jq -r '.result' /tmp/claude/pf-raw.json | extract_json >> /tmp/claude/perfile-summaries.json
              c="$(jq -r '.total_cost_usd // 0' /tmp/claude/pf-raw.json)"
              awk -v add="$c" '{printf "%.4f", $1 + add}' /tmp/claude/pass1-cost > /tmp/claude/pass1-cost.new
              mv /tmp/claude/pass1-cost.new /tmp/claude/pass1-cost
            done < /tmp/perfile-list
            {
              echo "SCOPE: INTEGRATION PASS — see '## Pass scopes' in the prompt below. Flag ONLY cross-file defects; do not re-report the per-file findings."
              echo
              cat docs/CI_REVIEW_PROMPT.md
              echo; echo "## Per-file findings already collected"; echo '```json'
              cat /tmp/claude/perfile-summaries.json
              echo '```'
              if [ "$HAS_PRIOR" = "true" ]; then
                echo; echo "## Prior review (report only NEW or STILL-UNADDRESSED issues)"
                echo '```json'; cat /tmp/prior.json; echo '```'
              fi
              echo; echo "## Unified diff under review (all files)"; echo '```diff'
              cat /tmp/pr.diff
              echo '```'
            } > /tmp/claude/integration-prompt.md
            claude -p "$(cat /tmp/claude/integration-prompt.md)" --output-format json > /tmp/claude/integration-raw.json
            jq -r '.result' /tmp/claude/integration-raw.json | extract_json > /tmp/claude/integration.json
            c="$(jq -r '.total_cost_usd // 0' /tmp/claude/integration-raw.json)"
            awk -v add="$c" '{printf "%.4f", $1 + add}' /tmp/claude/pass1-cost > /tmp/claude/pass1-cost.new
            mv /tmp/claude/pass1-cost.new /tmp/claude/pass1-cost
            # Merge per-file + integration into one draft ReviewSummary.
            jq -s '
              ((map(.comments) | add) // []) as $c |
              { comments: $c,
                verdict: (if ($c | map(select(.severity == "blocker")) | length) > 0 then "request_changes"
                          elif ($c | length) > 0 then "comment_only" else "approve" end),
                confidence: (if length > 0 then (map(.confidence) | min) else 0.5 end),
                promptVersion: (.[0].promptVersion // "unknown") }
            ' /tmp/claude/perfile-summaries.json /tmp/claude/integration.json > /tmp/claude/pass1.json
          else
            # Dry-run over the REAL PR diff. --split exercises the same
            # per-file + integration architecture synthetically; --raw defers
            # the calibrated confidence gate to pass 2's final emission.
            npm run -s review:dry -- /tmp/pr.diff --split --raw > /tmp/claude/pass1.json
            echo 0 > /tmp/claude/pass1-cost
          fi
          echo "--- pass 1 (merged draft) ---"; cat /tmp/claude/pass1.json

      # Pass 2 — independent filter (deepening task A). A SECOND fresh
      # process with no context from pass 1 beyond its emitted draft.
      - name: Review pass 2 (independent filter)
        if: steps.budget.outputs.skip != 'true'
        id: pass2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.mode }}" = "real" ]; then
            {
              cat docs/CI_REVIEW_OF_REVIEW_PROMPT.md
              echo; echo "## Draft findings from the first reviewer"; echo '```json'
              cat /tmp/claude/pass1.json
              echo '```'; echo; echo "## Unified diff under review"; echo '```diff'
              cat /tmp/pr.diff
              echo '```'
            } > /tmp/claude/pass2-prompt.md
            claude -p "$(cat /tmp/claude/pass2-prompt.md)" --output-format json \
              > /tmp/claude/pass2-raw.json
            jq -r '.result' /tmp/claude/pass2-raw.json \
              | npx tsx -e 'import{extractFirstJsonObject}from"./src/agents/schemas/parse";let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{const o=extractFirstJsonObject(t);if(!o){console.error("pass 2 emitted no JSON object");process.exit(1)}console.log(JSON.stringify(o,null,2))})' \
              > /tmp/claude/pass2-unthresholded.json
            # Calibrated confidence gate (v0.7, deepening task F) — the
            # FINAL emission stage. See CONFIDENCE_THRESHOLD in
            # src/agents/schemas/reviewOutput.ts and §Confidence threshold
            # in docs/CI_REVIEW_PROMPT.md.
            npx tsx -e 'import{applyConfidenceThreshold}from"./scripts/review-pr";import{readFileSync}from"node:fs";const s=JSON.parse(readFileSync("/tmp/claude/pass2-unthresholded.json","utf8"));console.log(JSON.stringify(applyConfidenceThreshold(s),null,2))' \
              > /tmp/claude/pass2.json
            jq -r '.total_cost_usd // 0' /tmp/claude/pass2-raw.json > /tmp/claude/pass2-cost
          else
            # review-filter applies the calibrated confidence gate itself
            # (its default, non---raw mode) — no separate step needed.
            npm run -s review:filter -- --draft /tmp/claude/pass1.json --diff /tmp/pr.diff \
              > /tmp/claude/pass2.json
            echo 0 > /tmp/claude/pass2-cost
          fi
          echo "--- pass 2 (filtered + thresholded) ---"; cat /tmp/claude/pass2.json

      # Dedupe vs the prior run (deepening task D).
      - name: Dedupe against prior review
        if: steps.budget.outputs.skip != 'true'
        env:
          HAS_PRIOR: ${{ steps.prior.outputs.has_prior }}
        run: |
          set -euo pipefail
          if [ "$HAS_PRIOR" = "true" ]; then
            npm run -s ci:dedupe -- --prior /tmp/prior.json --current /tmp/claude/pass2.json \
              > /tmp/claude/dedupe.json
          else
            npm run -s ci:dedupe -- --current /tmp/claude/pass2.json > /tmp/claude/dedupe.json
          fi

      # Post. Acceptance (task D): a no-op push (nothing new, nothing
      # resolved, prior exists) posts NOTHING. Otherwise the comment lists
      # new findings, still-unaddressed ones, and resolved ones, and embeds
      # the machine-readable summary the NEXT run will dedupe against.
      - name: Post review to PR
        if: steps.budget.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HAS_PRIOR: ${{ steps.prior.outputs.has_prior }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          new_count="$(jq '.new | length' /tmp/claude/dedupe.json)"
          open_count="$(jq '.stillOpen | length' /tmp/claude/dedupe.json)"
          resolved_count="$(jq '.resolved | length' /tmp/claude/dedupe.json)"
          verdict="$(jq -r '.summary.verdict' /tmp/claude/dedupe.json)"

          if [ "$HAS_PRIOR" = "true" ] && [ "$new_count" = "0" ] && [ "$resolved_count" = "0" ]; then
            echo "No new findings and nothing resolved since the prior review — posting nothing."
            exit 0
          fi

          fmt='map("- **" + .severity + "** `" + .path + ":" + (.line|tostring) + "` (conf " + (.confidence|tostring) + ") — " + .rationale) | join("\n")'
          body="$(jq -r --arg mode "$MODE" '
            "Claude review (prompt " + .summary.promptVersion + ", two-pass" + (if $mode == "dry" then ", DRY-RUN — synthetic reviewer" else "" end) + ")\n\n" +
            (if (.new | length) > 0 then "### New findings\n" + (.new | '"$fmt"') + "\n\n" else "" end) +
            (if (.stillOpen | length) > 0 then "### Still unaddressed\n" + (.stillOpen | '"$fmt"') + "\n\n" else "" end) +
            (if (.resolved | length) > 0 then "### ✓ Resolved since last review\n" + (.resolved | map("- ~~`" + .path + ":" + (.line|tostring) + "`~~ — " + .rationale) | join("\n")) + "\n\n" else "" end) +
            (if ((.new | length) + (.stillOpen | length)) == 0 then "No open findings.\n\n" else "" end)
          ' /tmp/claude/dedupe.json)"
          marker="<!-- claude-review:summary v1 -->"
          summary_json="$(jq '.summary' /tmp/claude/dedupe.json)"
          body="$body
          $marker
          \`\`\`json
          $summary_json
          \`\`\`"

          echo "Verdict: $verdict (new=$new_count open=$open_count resolved=$resolved_count)"
          case "$verdict" in
            request_changes)
              gh pr review "$PR_NUMBER" --repo "${{ github.repository }}" --request-changes --body "$body" ;;
            comment_only)
              gh pr review "$PR_NUMBER" --repo "${{ github.repository }}" --comment --body "$body" ;;
            approve)
              gh pr review "$PR_NUMBER" --repo "${{ github.repository }}" --approve --body "$body" ;;
            *)
              echo "Unknown verdict: $verdict" >&2; exit 1 ;;
          esac

      # Record spend on the `_runs` branch ledger (Contents API — no git
      # push, no persisted credentials). Dry runs cost nothing and are not
      # recorded, so the ledger only carries real spend.
      - name: Record spend
        if: steps.budget.outputs.skip != 'true' && steps.mode.outputs.mode == 'real'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cost="$(awk '{s+=$1} END {printf "%.4f", s}' /tmp/claude/pass1-cost /tmp/claude/pass2-cost)"
          npm run -s ci:budget -- record --ledger /tmp/spend.json --cost "$cost" > /dev/null
          content_b64="$(base64 -w0 < /tmp/spend.json)"

          # Bootstrap the orphan `_runs` branch on first use (git database API).
          if ! gh api "repos/${{ github.repository }}/git/ref/heads/_runs" >/dev/null 2>&1; then
            blob_sha="$(gh api -X POST "repos/${{ github.repository }}/git/blobs" -f content="$content_b64" -f encoding=base64 --jq .sha)"
            tree_sha="$(gh api -X POST "repos/${{ github.repository }}/git/trees" \
              -f 'tree[][path]=ci/spend.json' -f 'tree[][mode]=100644' -f 'tree[][type]=blob' -f "tree[][sha]=$blob_sha" --jq .sha)"
            commit_sha="$(gh api -X POST "repos/${{ github.repository }}/git/commits" \
              -f message="ci: bootstrap review spend ledger" -f tree="$tree_sha" --jq .sha)"
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/_runs" -f sha="$commit_sha" >/dev/null
            echo "Bootstrapped _runs branch with initial ledger."
          else
            existing_sha="$(gh api "repos/${{ github.repository }}/contents/ci/spend.json?ref=_runs" --jq .sha 2>/dev/null || true)"
            gh api -X PUT "repos/${{ github.repository }}/contents/ci/spend.json" \
              -f message="ci: record review spend (\$${cost})" \
              -f content="$content_b64" -f branch="_runs" \
              ${existing_sha:+-f sha="$existing_sha"} >/dev/null
            echo "Recorded \$${cost} to _runs ledger."
          fi
